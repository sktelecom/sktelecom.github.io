version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: daily
      time: '20:00'
    open-pull-requests-limit: 10
    ignore:
      # FontAwesome 7은 SCSS를 Dart Sass 모듈 문법으로 다시 써서
      # Hugo의 libsass가 컴파일하지 못하고, 개별 $fa-var-* 변수도 없앴다.
      # Docsy가 그 변수들을 참조하므로 사이트 빌드가 깨진다(PR #294).
      # Docsy가 FontAwesome 7을 지원하면 이 항목을 지운다.
      - dependency-name: '@fortawesome/fontawesome-free'
        update-types: ['version-update:semver-major']
  - package-ecosystem: bundler
    directory: '/'
    schedule:
      interval: daily
      time: '20:00'
    open-pull-requests-limit: 10
  # Docsy 테마(Hugo/Go 모듈) 업데이트 PR을 자동 생성한다.
  # 테마 변경은 빈도가 낮으므로 주간 주기로 둔다.
  - package-ecosystem: gomod
    directory: '/'
    schedule:
      interval: weekly
      time: '20:00'
    open-pull-requests-limit: 5
  # GitHub Actions(워크플로에서 사용하는 액션) 버전을 자동 추적한다.
  # 예: actions/checkout, actions/setup-node, peaceiris/actions-gh-pages 등
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      time: '20:00'
    open-pull-requests-limit: 5
