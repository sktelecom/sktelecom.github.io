<svg xmlns="http://www.w3.org/2000/svg" width="860" height="434" viewBox="0 0 860 434" font-family="'Apple SD Gothic Neo','Noto Sans CJK KR','Malgun Gothic',sans-serif">
  <defs>
    <filter id="ds" x="-15%" y="-40%" width="130%" height="200%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="3" flood-color="#111014" flood-opacity="0.09"/>
    </filter>
  </defs>
  <rect width="860" height="434" fill="#FFFFFF"/>

  <text x="32" y="52" font-size="13" fill="#7C7880">언제 소스 코드를 공개해야 하나</text>
  <text x="430" y="54" text-anchor="middle" font-size="17" font-weight="700" fill="#1A1A1E">GPL-3.0</text>
  <text x="706" y="54" text-anchor="middle" font-size="17" font-weight="700" fill="#EA002C">AGPL-3.0</text>

  <text x="32" y="122" font-size="15.5" font-weight="700" fill="#1A1A1E">소스나 바이너리를 배포</text>
  <text x="32" y="150" font-size="12.5" fill="#7C7880">제품, 파일, 이미지를 외부에</text>
  <text x="32" y="170" font-size="12.5" fill="#7C7880">전달하는 경우</text>
  <g filter="url(#ds)"><rect x="300" y="84" width="260" height="124" rx="12" fill="#FFFFFF" stroke="#E6E3DF"/></g>
  <rect x="320" y="102" width="150" height="28" rx="14" fill="#1A1A1E"/>
  <text x="395" y="121" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">공개 의무 있음</text>
  <text x="320" y="154" font-size="12.5" fill="#7C7880">바이너리에 해당하는</text>
  <text x="320" y="174" font-size="12.5" fill="#7C7880">전체 소스 코드와 빌드 환경을</text>
  <text x="320" y="194" font-size="12.5" fill="#7C7880">제공합니다</text>
  <g filter="url(#ds)"><rect x="576" y="84" width="260" height="124" rx="12" fill="#FFFFFF" stroke="#E6E3DF"/></g>
  <rect x="596" y="102" width="150" height="28" rx="14" fill="#1A1A1E"/>
  <text x="671" y="121" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">공개 의무 있음</text>
  <text x="596" y="154" font-size="12.5" fill="#7C7880">GPL-3.0과 같은 범위로</text>
  <text x="596" y="174" font-size="12.5" fill="#7C7880">소스 코드와 빌드 환경을</text>
  <text x="596" y="194" font-size="12.5" fill="#7C7880">제공합니다</text>

  <text x="32" y="258" font-size="15.5" font-weight="700" fill="#1A1A1E">배포 없이 네트워크로 제공</text>
  <text x="32" y="286" font-size="12.5" fill="#7C7880">SaaS, 클라우드 서비스처럼</text>
  <text x="32" y="306" font-size="12.5" fill="#7C7880">서버에서만 실행하는 경우</text>
  <g filter="url(#ds)"><rect x="300" y="220" width="260" height="124" rx="12" fill="#FFFFFF" stroke="#E6E3DF"/></g>
  <rect x="320" y="238" width="150" height="28" rx="14" fill="#EDEBE8"/>
  <text x="395" y="257" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1E">의무 없음</text>
  <text x="320" y="290" font-size="12.5" fill="#7C7880">배포에 해당하지 않으므로</text>
  <text x="320" y="310" font-size="12.5" fill="#7C7880">소스 코드 공개 의무가</text>
  <text x="320" y="330" font-size="12.5" fill="#7C7880">발생하지 않습니다</text>
  <g filter="url(#ds)"><rect x="576" y="220" width="260" height="124" rx="12" fill="#FEF7F8" stroke="#EA002C"/></g>
  <rect x="596" y="238" width="150" height="28" rx="14" fill="#1A1A1E"/>
  <text x="671" y="257" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">공개 의무 있음</text>
  <text x="596" y="290" font-size="12.5" fill="#7C7880">수정한 버전이라면 원격</text>
  <text x="596" y="310" font-size="12.5" fill="#7C7880">사용자가 소스 코드를 받을 수</text>
  <text x="596" y="330" font-size="12.5" fill="#7C7880">있는 서버를 제공합니다</text>

  <rect x="24" y="360" width="812" height="58" rx="10" fill="#F7F6F4" stroke="#E6E3DF"/>
  <text x="430" y="383" text-anchor="middle" font-size="13.5" fill="#1A1A1E">AGPL-3.0 제13조의 네트워크 조항은 수정한 버전에 적용됩니다.</text>
  <text x="430" y="403" text-anchor="middle" font-size="13.5" fill="#1A1A1E">수정 없이 그대로 운영하면 네트워크로 제공하는 것만으로는 공개 의무가 생기지 않습니다.</text>
</svg>
