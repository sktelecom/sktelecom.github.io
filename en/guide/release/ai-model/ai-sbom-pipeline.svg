<svg xmlns="http://www.w3.org/2000/svg" width="860" height="648" viewBox="0 0 860 648" font-family="'Apple SD Gothic Neo','Noto Sans CJK KR','Malgun Gothic',sans-serif">
  <defs>
    <filter id="s1" x="-20%" y="-40%" width="140%" height="200%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="3" flood-color="#111014" flood-opacity="0.09"/>
    </filter>
    <filter id="s2" x="-40%" y="-60%" width="180%" height="240%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#111014" flood-opacity="0.16"/>
    </filter>
    <marker id="a" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3 L0,6 Z" fill="#9B96A0"/>
    </marker>
  </defs>
  <rect width="860" height="648" fill="#FFFFFF"/>

  <text x="430" y="46" text-anchor="middle" font-size="25" font-weight="700" fill="#1A1A1E" letter-spacing="-0.3">What an AI SBOM produces, and what a person decides</text>

  <text x="128" y="88" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2.5" fill="#B0ABB2">Input</text>
  <text x="375" y="88" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2.5" fill="#B0ABB2">Tool</text>
  <text x="677" y="88" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2.5" fill="#B0ABB2">Outputs</text>

  <!-- input -->
  <g filter="url(#s1)"><rect x="36" y="112" width="190" height="104" rx="14" fill="#FFFFFF" stroke="#E6E3DF"/></g>
  <g stroke="#8C8890" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(56,132)">
    <path d="M2 1 h11 l5 5 v15 a1 1 0 0 1 -1 1 h-15 a1 1 0 0 1 -1 -1 z"/><path d="M13 1 v5 h5" stroke="#C7C2CA"/>
  </g>
  <text x="88" y="148" font-size="17" font-weight="650" fill="#1A1A1E">Model card</text>
  <text x="56" y="182" font-size="15" fill="#7C7880">README.md in the repo</text>
  <text x="56" y="202" font-size="14" fill="#ABA6AE">weights not downloaded</text>

  <line x1="230" y1="164" x2="261" y2="164" stroke="#C6C1C8" stroke-width="2" marker-end="url(#a)"/>

  <!-- tool: the single accent -->
  <g filter="url(#s2)"><rect x="265" y="128" width="220" height="72" rx="14" fill="#EA002C"/></g>
  <g transform="translate(287,152)" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round">
    <circle cx="8" cy="8" r="7"/><line x1="13" y1="13" x2="18" y2="18"/>
  </g>
  <text x="319" y="160" font-size="18" font-weight="700" fill="#FFFFFF">BomLens</text>
  <text x="319" y="182" font-size="14" fill="#F6C9D1">reads the model card</text>

  <!-- fan-out -->
  <g stroke="#C6C1C8" stroke-width="2" fill="none">
    <line x1="485" y1="164" x2="505" y2="164"/>
    <path d="M505 128 V296"/>
    <line x1="505" y1="128" x2="523" y2="128" marker-end="url(#a)"/>
    <line x1="505" y1="184" x2="523" y2="184" marker-end="url(#a)"/>
    <line x1="505" y1="240" x2="523" y2="240" marker-end="url(#a)"/>
    <line x1="505" y1="296" x2="523" y2="296" marker-end="url(#a)"/>
  </g>

  <!-- outputs: neutral cards, structure not color -->
  <g font-size="15" font-weight="600" fill="#1A1A1E">
    <g filter="url(#s1)"><rect x="527" y="106" width="301" height="44" rx="10" fill="#FFFFFF" stroke="#E6E3DF"/></g>
    <text x="549" y="133.5">AI SBOM (ML-BOM, CycloneDX)</text>
    <g filter="url(#s1)"><rect x="527" y="162" width="301" height="44" rx="10" fill="#FFFFFF" stroke="#E6E3DF"/></g>
    <text x="549" y="189.5">G7 element coverage · how to fill gaps</text>
    <g filter="url(#s1)"><rect x="527" y="218" width="301" height="44" rx="10" fill="#FFFFFF" stroke="#E6E3DF"/></g>
    <text x="549" y="245.5">Regulatory mapping (EU · Korea)</text>
    <g filter="url(#s1)"><rect x="527" y="274" width="301" height="44" rx="10" fill="#FFFFFF" stroke="#E6E3DF"/></g>
    <text x="549" y="301.5">Licenses flagged for review</text>
  </g>

  <!-- human zone: separated by structure + label, not color -->
  <rect x="36" y="352" width="792" height="244" rx="16" fill="#F7F6F4" stroke="#E6E3DF"/>
  <g transform="translate(58,372)" stroke="#5E5A62" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="8" cy="6" r="4"/><path d="M1 20 a7 7 0 0 1 14 0"/>
  </g>
  <text x="88" y="388" font-size="17" font-weight="700" fill="#2B2930">What a person decides — what the tool cannot fill</text>
  <line x1="58" y1="404" x2="806" y2="404" stroke="#E2DED9" stroke-width="1"/>

  <g>
    <g filter="url(#s1)"><rect x="58" y="420" width="748" height="46" rx="11" fill="#FFFFFF" stroke="#E6E3DF"/></g>
    <text x="80" y="449" font-size="16" font-weight="700" fill="#1A1A1E">13 review-only elements</text>
    <text x="280" y="449" font-size="15" fill="#7C7880">Intended use area, training-data sensitivity — nothing a model card field proves</text>

    <g filter="url(#s1)"><rect x="58" y="474" width="748" height="46" rx="11" fill="#FFFFFF" stroke="#E6E3DF"/></g>
    <text x="80" y="503" font-size="16" font-weight="700" fill="#1A1A1E">Dataset licenses</text>
    <text x="280" y="503" font-size="15" fill="#7C7880">Redistribution and commercial terms of training data, checked by a person</text>

    <g filter="url(#s1)"><rect x="58" y="528" width="748" height="46" rx="11" fill="#FFFFFF" stroke="#E6E3DF"/></g>
    <text x="80" y="557" font-size="16" font-weight="700" fill="#1A1A1E">Personal data · copyright</text>
    <text x="280" y="557" font-size="15" fill="#7C7880">Whether personal data or others' works are in the data — the tool does not look</text>
  </g>

  <text x="430" y="622" text-anchor="middle" font-size="13.5" fill="#ABA6AE">The verdict comes from the mandatory format checks; G7 elements are advisory and do not affect it.</text>
</svg>
