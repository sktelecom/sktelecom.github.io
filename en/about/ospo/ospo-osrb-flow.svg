<svg xmlns="http://www.w3.org/2000/svg" width="860" height="150" viewBox="0 0 860 150" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <defs>
    <filter id="cs" x="-15%" y="-40%" width="130%" height="200%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="3" flood-color="#111014" flood-opacity="0.09"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3 L0,6 Z" fill="#9B96A0"/>
    </marker>
  </defs>
  <rect width="860" height="150" fill="#FFFFFF"/>

  <!-- step 1: dev team -->
  <g filter="url(#cs)"><rect x="20" y="30" width="170" height="88" rx="12" fill="#FFFFFF" stroke="#E6E3DF"/></g>
  <circle cx="46" cy="58" r="13" fill="#2B2930"/><text x="46" y="63" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">1</text>
  <text x="68" y="63" font-size="16" font-weight="600" fill="#1A1A1E">Dev Team</text>
  <text x="40" y="94" font-size="12.5" fill="#7C7880">Adopt · Contribute · Release</text>

  <line x1="190" y1="74" x2="222" y2="74" stroke="#C6C1C8" stroke-width="2" marker-end="url(#ar)"/>

  <!-- step 2: OSPO -->
  <g filter="url(#cs)"><rect x="230" y="30" width="170" height="88" rx="12" fill="#F7F6F4" stroke="#E6E3DF"/></g>
  <circle cx="256" cy="58" r="13" fill="#2B2930"/><text x="256" y="63" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">2</text>
  <text x="278" y="63" font-size="17" font-weight="600" fill="#1A1A1E">OSPO</text>
  <text x="250" y="94" font-size="13" fill="#7C7880">Initial review</text>

  <line x1="400" y1="74" x2="432" y2="74" stroke="#C6C1C8" stroke-width="2" marker-end="url(#ar)"/>

  <!-- step 3: OSRB -->
  <g filter="url(#cs)"><rect x="440" y="30" width="170" height="88" rx="12" fill="#F7F6F4" stroke="#E6E3DF"/></g>
  <circle cx="466" cy="58" r="13" fill="#2B2930"/><text x="466" y="63" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">3</text>
  <text x="488" y="63" font-size="17" font-weight="600" fill="#1A1A1E">OSRB</text>
  <text x="460" y="94" font-size="13" fill="#7C7880">Final deliberation</text>

  <!-- fork to outcomes -->
  <line x1="610" y1="74" x2="642" y2="50" stroke="#C6C1C8" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="610" y1="74" x2="642" y2="98" stroke="#C6C1C8" stroke-width="2" marker-end="url(#ar)"/>

  <!-- outcomes -->
  <g filter="url(#cs)"><rect x="650" y="30" width="190" height="40" rx="10" fill="#FFFFFF" stroke="#1A1A1E" stroke-width="1.5"/></g>
  <text x="745" y="55" text-anchor="middle" font-size="16" font-weight="700" fill="#1A1A1E">Approve</text>

  <g filter="url(#cs)"><rect x="650" y="78" width="190" height="40" rx="10" fill="#FFFFFF" stroke="#E6E3DF"/></g>
  <text x="745" y="103" text-anchor="middle" font-size="15" font-weight="600" fill="#7C7880">Reject</text>
</svg>
