<svg xmlns="http://www.w3.org/2000/svg" width="860" height="496" viewBox="0 0 860 496" font-family="'Apple SD Gothic Neo','Noto Sans CJK KR','Malgun Gothic',sans-serif">
  <defs>
    <filter id="cs" x="-15%" y="-40%" width="130%" height="200%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="3" flood-color="#111014" flood-opacity="0.09"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3 L0,6 Z" fill="#9B96A0"/>
    </marker>
    <marker id="arS" markerWidth="9" markerHeight="9" refX="0.5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M7,0 L0,3 L7,6 Z" fill="#9B96A0"/>
    </marker>
  </defs>
  <rect width="860" height="496" fill="#FFFFFF"/>

  <!-- lanes: separated by structure and label, not by color -->
  <rect x="28" y="14" width="200" height="468" rx="14" fill="#F7F6F4" stroke="#E6E3DF"/>
  <rect x="252" y="14" width="316" height="468" rx="14" fill="#F7F6F4" stroke="#E6E3DF"/>
  <rect x="592" y="14" width="240" height="468" rx="14" fill="#F7F6F4" stroke="#E6E3DF"/>
  <text x="128" y="42" text-anchor="middle" font-size="16" font-weight="700" fill="#5E5A62">OSRB</text>
  <text x="410" y="42" text-anchor="middle" font-size="16" font-weight="700" fill="#5E5A62">Dev Team</text>
  <text x="712" y="42" text-anchor="middle" font-size="16" font-weight="700" fill="#5E5A62">Open Source Project</text>

  <!-- dev team steps -->
  <g>
    <g filter="url(#cs)"><rect x="272" y="60" width="276" height="64" rx="12" fill="#FFFFFF" stroke="#E6E3DF"/></g>
    <circle cx="296" cy="92" r="13" fill="#2B2930"/><text x="296" y="97" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">1</text>
    <text x="318" y="98" font-size="17" font-weight="600" fill="#1A1A1E">Internal approval</text>

    <g filter="url(#cs)"><rect x="272" y="144" width="276" height="64" rx="12" fill="#FFFFFF" stroke="#E6E3DF"/></g>
    <circle cx="296" cy="176" r="13" fill="#2B2930"/><text x="296" y="181" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">2</text>
    <text x="318" y="182" font-size="17" font-weight="600" fill="#1A1A1E">Request a review</text>

    <g filter="url(#cs)"><rect x="272" y="228" width="276" height="64" rx="12" fill="#FFFFFF" stroke="#E6E3DF"/></g>
    <circle cx="296" cy="260" r="13" fill="#2B2930"/><text x="296" y="265" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">3</text>
    <text x="318" y="266" font-size="17" font-weight="600" fill="#1A1A1E">Scope after approval</text>

    <g filter="url(#cs)"><rect x="272" y="312" width="276" height="64" rx="12" fill="#FFFFFF" stroke="#E6E3DF"/></g>
    <circle cx="296" cy="344" r="13" fill="#2B2930"/><text x="296" y="349" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">4</text>
    <text x="318" y="350" font-size="17" font-weight="600" fill="#1A1A1E">Review project docs</text>

    <g filter="url(#cs)"><rect x="272" y="396" width="276" height="64" rx="12" fill="#FFFFFF" stroke="#E6E3DF"/></g>
    <circle cx="296" cy="428" r="13" fill="#2B2930"/><text x="296" y="433" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">5</text>
    <text x="318" y="434" font-size="17" font-weight="600" fill="#1A1A1E">Submit contribution</text>
  </g>

  <!-- step to step -->
  <g stroke="#C6C1C8" stroke-width="2">
    <line x1="410" y1="124" x2="410" y2="140" marker-end="url(#ar)"/>
    <line x1="410" y1="208" x2="410" y2="224" marker-end="url(#ar)"/>
    <line x1="410" y1="292" x2="410" y2="308" marker-end="url(#ar)"/>
    <line x1="410" y1="376" x2="410" y2="392" marker-end="url(#ar)"/>
  </g>

  <!-- OSRB review, aligned with step 2 -->
  <g filter="url(#cs)"><rect x="48" y="144" width="160" height="64" rx="12" fill="#FFFFFF" stroke="#E6E3DF"/></g>
  <text x="128" y="182" text-anchor="middle" font-size="17" font-weight="600" fill="#1A1A1E">Review / Approval</text>
  <line x1="212" y1="176" x2="268" y2="176" stroke="#C6C1C8" stroke-width="2" marker-end="url(#ar)" marker-start="url(#arS)"/>

  <!-- project docs, referenced by step 4 -->
  <g filter="url(#cs)"><rect x="612" y="312" width="200" height="64" rx="12" fill="#FFFFFF" stroke="#E6E3DF"/></g>
  <text x="712" y="338" text-anchor="middle" font-size="16" font-weight="600" fill="#1A1A1E">Contribution guides</text>
  <text x="712" y="360" text-anchor="middle" font-size="14" fill="#7C7880">README, CONTRIBUTING</text>
  <line x1="548" y1="344" x2="612" y2="344" stroke="#C6C1C8" stroke-width="2"/>

  <!-- GitHub, target of step 5 -->
  <g filter="url(#cs)"><rect x="652" y="396" width="120" height="64" rx="12" fill="#FFFFFF" stroke="#E6E3DF"/></g>
  <text x="712" y="434" text-anchor="middle" font-size="17" font-weight="600" fill="#1A1A1E">GitHub</text>
  <line x1="548" y1="428" x2="648" y2="428" stroke="#C6C1C8" stroke-width="2" marker-end="url(#ar)"/>
</svg>
